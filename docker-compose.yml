services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: milind78/resumeai-backend:latest
    container_name: resumeai-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
